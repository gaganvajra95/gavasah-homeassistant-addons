# ==============================================================================
# GAVASAH CLOUD BASTION - OpenSSH Tunnel Daemon Enterprise High-Scale Tuning
# Target Host: CT 150 (gavasah-cloud-hub) - 16 GB RAM Configuration
# Path: /etc/ssh/sshd_config.d/gavasah_tunnels.conf
# ==============================================================================

# Listen on dedicated tunnel ingress port
Port 2222

# Security & Port Forwarding
GatewayPorts yes
AllowTcpForwarding yes
X11Forwarding no
PermitTTY no
AllowAgentForwarding no
PasswordAuthentication no
PubkeyAuthentication yes

# High-Concurrency Scale Settings (Prevents dropped connections during reconnect storms)
# MaxStartups unauthenticated:rate:burst
MaxStartups 1000:30:2000
MaxSessions 2000

# Keep-Alive & Dead Connection Detection (Detects dropped WAN connections in <= 90s)
TCPKeepAlive yes
ClientAliveInterval 30
ClientAliveCountMax 3

# File Descriptors & Process Limits
UseDNS no
PrintMotd no
